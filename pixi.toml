[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-noise-simplex"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092905"
python = "3.13.*"
pytest = "*"
numpy = "*"
noise = ">=1.2.2,<2"
# must track the mojo pin exactly: max 26.7.0.dev2026092*05 and mojo
# 1.2.0.dev2026092*05 are released as one build. A mismatch makes the solve
# fail on mojo-compiler ==1.2.0.dev2026092905.
max = "==26.7.0.dev2026092905"
